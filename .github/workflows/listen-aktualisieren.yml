# Holt jeden Tag die neuen Fake-Shop-Warnungen der Verbraucherzentralen und veröffentlicht sie unter
# https://scamlight.de/listen/vz_fakeshops.txt – von dort lädt die ScamLight-App sie täglich (D-084).
name: Fake-Shop-Liste aktualisieren
on:
  schedule:
    - cron: "17 4 * * *"   # täglich 04:17 UTC
  workflow_dispatch: {}      # von Hand starten: Actions → „Fake-Shop-Liste aktualisieren“ → Run workflow
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Liste neu erzeugen
        run: python3 tools/build_vz_list.py 4 listen/vz_fakeshops.txt tools/known_domains.bin
      - name: Veröffentlichen, falls sich etwas geändert hat
        run: |
          # nur Domains vergleichen (die Kopfzeile enthält das Datum)
          if git diff --quiet -I '^#' -- listen/vz_fakeshops.txt; then echo "Keine neuen Warnungen."; exit 0; fi
          git config user.name "scamlight-bot"
          git config user.email "scamlight-bot@users.noreply.github.com"
          git add listen/vz_fakeshops.txt
          git commit -m "Fake-Shop-Liste $(date -u +%F)"
          git push
